<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="The verification spine: OpenGATE, a deterministic gold-anchored verification standard with no LLM judge, gates PubCrawl, Redacta and StudyDiff on every release — baseline fidelity or the release blocks. The same verification pattern is shipped in RefCheckr and Patiently AI and distilled into the LitRAG and RSI Loop reference repos.">
